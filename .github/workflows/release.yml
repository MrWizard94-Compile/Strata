name: Playable build

# Manual runs upload downloadable zips as workflow artifacts (kept 30 days).
# A push of a v* tag also publishes those zips on a GitHub Release. This
# workflow does not run on pull requests. The publish job is the only job
# that can write to the repository, and only when the ref is a version tag.
# macOS is omitted: hosted macOS minutes are a separate cost, and this
# repository has no verified Mac build.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playable-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: ${{ matrix.shell }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x86_64
            shell: pwsh
            zip: strata-windows-x86_64.zip
          # Ubuntu 22.04 keeps the published binary on glibc 2.35. The image
          # is scheduled for removal in April 2027; when it goes, move this
          # job forward and update the glibc note in PLAYING.md.
          - os: ubuntu-22.04
            label: linux-x86_64
            shell: bash
            zip: strata-linux-x86_64.zip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install lavapipe
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1 zip
          icd="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)"
          if [ -z "$icd" ]; then
            echo 'lavapipe ICD was not installed'
            exit 1
          fi
          echo "LAVAPIPE_ICD=$icd" >> "$GITHUB_ENV"

      - name: Install the pinned toolchain
        run: |
          rustup show
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc --version
          cargo --version
        if: runner.os == 'Windows'
      - name: Install the pinned toolchain
        run: |
          rustup show
          rustc --version
          cargo --version
        if: runner.os == 'Linux'

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Formatting
        run: cargo fmt --check

      - name: Source regression suite
        run: cargo test --locked

      - name: Shader pipeline validation
        if: runner.os == 'Linux'
        env:
          VK_DRIVER_FILES: ${{ env.LAVAPIPE_ICD }}
          VK_ICD_FILENAMES: ${{ env.LAVAPIPE_ICD }}
          WGPU_BACKEND: vulkan
        run: cargo test --locked native_gpu_validates_all_world_shader_pipelines -- --ignored --nocapture

      - name: Strict linting
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Locked Windows release build
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          # The distributed executable must not ask for the Visual C++ runtime.
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --locked

      - name: Locked Linux release build
        if: runner.os == 'Linux'
        run: cargo build --release --locked

      - name: Release executable hides the console
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'target\release\strata.exe'
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          if ($bytes.Length -lt 96) { throw 'Release executable is too small to be a PE file.' }
          $pe = [BitConverter]::ToInt32($bytes, 0x3C)
          if ($pe -lt 0 -or ($pe + 96) -gt $bytes.Length) { throw "Invalid PE header offset: $pe" }
          $signature = [BitConverter]::ToUInt32($bytes, $pe)
          if ($signature -ne 0x00004550) { throw 'Missing PE signature.' }
          $magic = [BitConverter]::ToUInt16($bytes, $pe + 24)
          if ($magic -ne 0x20B) { throw "Expected a PE32+ executable, found magic 0x$($magic.ToString('X'))." }
          $subsystem = [BitConverter]::ToUInt16($bytes, $pe + 24 + 68)
          if ($subsystem -ne 2) { throw "Release subsystem is $subsystem; expected 2 (Windows GUI, no console)." }
          Write-Host 'Release executable uses the Windows GUI subsystem.'

      - name: Package Windows zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -LiteralPath 'target\release\strata.exe' -Destination 'dist\strata.exe'
          Copy-Item -LiteralPath 'PLAYING.md' -Destination 'dist\PLAYING.md'
          if (Test-Path -LiteralPath '${{ matrix.zip }}') { Remove-Item -LiteralPath '${{ matrix.zip }}' }
          tar -a -c -f '${{ matrix.zip }}' -C dist strata.exe PLAYING.md
          $zip = Join-Path $PWD '${{ matrix.zip }}'
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText("$zip.sha256", "$hash  ${{ matrix.zip }}`n")
          Write-Host "$hash  ${{ matrix.zip }}"

      - name: Package Linux zip
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp target/release/strata dist/strata
          chmod 755 dist/strata
          cp PLAYING.md dist/PLAYING.md
          file dist/strata | grep -q 'ELF 64-bit'
          zip -j '${{ matrix.zip }}' dist/strata dist/PLAYING.md
          sha256sum '${{ matrix.zip }}' | tee '${{ matrix.zip }}.sha256'

      - name: Upload zip
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ matrix.zip }}
          if-no-files-found: error
          retention-days: 30
          archive: false

      - name: Upload checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ matrix.zip }}.sha256
          if-no-files-found: error
          retention-days: 30
          archive: false

  publish:
    name: Publish GitHub Release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdabf93d22962f4752f3646cd9 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Check checksums and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          find dist -type f -print
          cd dist
          test -f strata-windows-x86_64.zip
          test -f strata-linux-x86_64.zip
          test -f strata-windows-x86_64.zip.sha256
          test -f strata-linux-x86_64.zip.sha256
          sort -o SHA256SUMS.txt strata-windows-x86_64.zip.sha256 strata-linux-x86_64.zip.sha256
          sha256sum -c SHA256SUMS.txt
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists. Refusing to replace it."
            exit 1
          fi
          cat > release-notes.md <<'EOF'
          Early playable build of STRATA, a working title. This is not a finished game and it is not a signed installer.

          ## Files
          - strata-windows-x86_64.zip — 64-bit Windows. Unzip it and run strata.exe. If SmartScreen warns, choose More info, then Run anyway.
          - strata-linux-x86_64.zip — 64-bit Linux, built on Ubuntu 22.04. It needs glibc 2.35 or newer, a Vulkan driver, and a desktop session.
          - SHA256SUMS.txt — checksums of those zip files.

          There is no Mac download. Playing, saves, and how to report a problem are in PLAYING.md inside each zip.

          ## Provenance
          - Source commit: SOURCE_SHA
          - Workflow run: RUN_URL
          - Build: cargo build --release --locked with the toolchain in rust-toolchain.toml (Rust 1.97.1).
          - The Windows executable is a release build. The windows_subsystem attribute is windows unless debug assertions are on, so this build does not open a console. Its C runtime is linked statically.
          - One checksum proves the identity of that uploaded file. It does not prove a second clean build would hash the same.

          ## Saves and rollback
          Worlds stay on the player's computer in saves/emerald-reach and are not inside the zip. Replacing the program does not delete or migrate them. Keep both world-a.json and world-b.json when copying a backup. To go back, download an older release and leave the saves folder in place.

          ## Limits
          Development checkpoint only. No code signature, auto-update, multiplayer, or Mac build. A green package job is not interactive acceptance on the GTX 1660 Ti.
          EOF
          # GitHub Actions removes this block's leading YAML indent before bash
          # runs. Fail if that ever stops, instead of publishing indented notes.
          sed -i \
            -e 's/SOURCE_SHA/${{ github.sha }}/' \
            -e 's|RUN_URL|${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|' \
            release-notes.md
          if ! grep -q '^Early playable build of STRATA' release-notes.md; then
            echo 'Release notes kept unexpected leading whitespace.'
            cat -A release-notes.md
            exit 1
          fi
          if grep -q 'SOURCE_SHA\|RUN_URL' release-notes.md; then
            echo 'Release note placeholders were not filled.'
            exit 1
          fi
          {
            echo
            echo '## Checksums'
            echo
            cat SHA256SUMS.txt
          } >> release-notes.md
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "STRATA $GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            strata-windows-x86_64.zip \
            strata-linux-x86_64.zip \
            SHA256SUMS.txt
